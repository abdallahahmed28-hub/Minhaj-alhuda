<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>منهاج الهدى | البث القرآني المباشر</title>
  
  <!-- إعدادات تطبيق الهاتف والاسم على الشاشة الرئيسية -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="منهاج الهدى">
  <meta name="application-name" content="منهاج الهدى">
  <meta name="theme-color" content="#061c14">

  <!-- أيقونة التطبيق الفاخرة للهاتف (شعار الكعبة المذهب) -->
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cdefs%3E%3ClinearGradient id='bg' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23051d15'/%3E%3Cstop offset='100%25' stop-color='%23020b08'/%3E%3C/linearGradient%3E%3ClinearGradient id='gold' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23ffe28a'/%3E%3Cstop offset='50%25' stop-color='%23d4af37'/%3E%3Cstop offset='100%25' stop-color='%23997517'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='512' height='512' rx='120' fill='url(%23bg)' stroke='url(%23gold)' stroke-width='14'/%3E%3Cpath d='M256 120 L380 180 L256 240 L132 180 Z' fill='url(%23gold)' opacity='0.9'/%3E%3Cpath d='M132 195 L250 252 V370 L132 305 Z' fill='%23111' stroke='url(%23gold)' stroke-width='4'/%3E%3Cpath d='M380 195 L262 252 V370 L380 305 Z' fill='%231f1f1f' stroke='url(%23gold)' stroke-width='4'/%3E%3Ccircle cx='256' cy='256' r='200' fill='none' stroke='url(%23gold)' stroke-width='2' stroke-dasharray='10 15' opacity='0.4'/%3E%3C/svg%3E">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cdefs%3E%3ClinearGradient id='bg' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23051d15'/%3E%3Cstop offset='100%25' stop-color='%23020b08'/%3E%3C/linearGradient%3E%3ClinearGradient id='gold' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23ffe28a'/%3E%3Cstop offset='50%25' stop-color='%23d4af37'/%3E%3Cstop offset='100%25' stop-color='%23997517'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='512' height='512' rx='120' fill='url(%23bg)' stroke='url(%23gold)' stroke-width='14'/%3E%3Cpath d='M256 120 L380 180 L256 240 L132 180 Z' fill='url(%23gold)' opacity='0.9'/%3E%3Cpath d='M132 195 L250 252 V370 L132 305 Z' fill='%23111' stroke='url(%23gold)' stroke-width='4'/%3E%3Cpath d='M380 195 L262 252 V370 L380 305 Z' fill='%231f1f1f' stroke='url(%23gold)' stroke-width='4'/%3E%3C/svg%3E">

  <!-- الخطوط العربية الفاخرة والأيقونات -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-dark: #04120c;
      --card-bg: rgba(7, 34, 24, 0.75);
      --card-active: rgba(14, 58, 41, 0.95);
      --gold-primary: #d4af37;
      --gold-light: #fef0be;
      --gold-gradient: linear-gradient(135deg, #fff2be 0%, #d4af37 50%, #997517 100%);
      --border-gold: rgba(212, 175, 55, 0.35);
      --text-muted: #b8cfc5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      background-image: radial-gradient(circle at top center, #0a3323 0%, #04120c 70%);
      color: #fff;
      font-family: 'Cairo', sans-serif;
      min-height: 100vh;
      padding-bottom: 120px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px 16px;
    }

    /* رأس الصفحة والشعار */
    .header-section {
      text-align: center;
      padding: 15px 0 10px;
    }

    .logo-frame {
      width: 76px;
      height: 76px;
      margin: 0 auto 12px;
      background: linear-gradient(145deg, #093424, #03140d);
      border: 2px solid var(--gold-primary);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6), inset 0 0 15px rgba(212,175,55,0.2);
    }

    .logo-frame i {
      font-size: 38px;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .app-title {
      font-family: 'Amiri', serif;
      font-size: 2.2rem;
      font-weight: 700;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    /* بطاقة التعريف المختصرة والآية */
    .intro-card {
      background: var(--card-bg);
      border: 1px solid var(--border-gold);
      border-radius: 16px;
      padding: 16px 20px;
      margin-bottom: 22px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      position: relative;
    }

    .quran-ayah {
      font-family: 'Amiri Quran', serif;
      font-size: 1.25rem;
      color: var(--gold-light);
      text-align: center;
      line-height: 1.8;
      margin-bottom: 8px;
    }

    .intro-desc {
      font-size: 0.92rem;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.6;
    }

    /* شريط البحث والتصنيفات */
    .search-box {
      position: relative;
      margin-bottom: 15px;
    }

    .search-box input {
      width: 100%;
      padding: 13px 44px 13px 18px;
      background: rgba(8, 38, 27, 0.85);
      border: 1px solid var(--border-gold);
      border-radius: 14px;
      color: #fff;
      font-family: 'Cairo', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s ease;
    }

    .search-box input:focus {
      border-color: var(--gold-primary);
      box-shadow: 0 0 12px rgba(212,175,55,0.3);
    }

    .search-box i {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gold-primary);
      font-size: 1.1rem;
    }

    .category-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 12px;
      scrollbar-width: none;
    }

    .category-tabs::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {
      background: rgba(10, 43, 31, 0.6);
      border: 1px solid rgba(212,175,55,0.25);
      color: var(--text-muted);
      padding: 7px 18px;
      border-radius: 20px;
      font-size: 0.88rem;
      font-family: 'Cairo', sans-serif;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .tab-btn.active {
      background: var(--gold-gradient);
      color: #04120c;
      font-weight: 700;
      border-color: var(--gold-primary);
      box-shadow: 0 4px 12px rgba(212,175,55,0.3);
    }

    /* شبكة المربعات الملكية للإذاعات والقراء */
    .radios-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
      gap: 12px;
      margin-top: 10px;
    }

    @media (min-width: 600px) {
      .radios-grid {
        grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
        gap: 16px;
      }
    }

    .radio-card {
      background: var(--card-bg);
      border: 1px solid var(--border-gold);
      border-radius: 16px;
      padding: 16px 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 125px;
      position: relative;
    }

    .radio-card:hover {
      transform: translateY(-3px);
      border-color: var(--gold-primary);
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }

    .radio-card.active {
      background: var(--card-active);
      border-color: var(--gold-primary);
      box-shadow: 0 0 15px rgba(212,175,55,0.35);
    }

    .card-icon {
      width: 44px;
      height: 44px;
      background: rgba(4, 18, 12, 0.8);
      border: 1px solid var(--border-gold);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
      color: var(--gold-primary);
      font-size: 1.1rem;
      transition: 0.3s;
    }

    .radio-card.active .card-icon {
      background: var(--gold-gradient);
      color: #04120c;
      transform: scale(1.1);
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
      line-height: 1.3;
    }

    .card-tag {
      font-size: 0.75rem;
      color: var(--gold-primary);
      background: rgba(212, 175, 55, 0.1);
      padding: 2px 8px;
      border-radius: 10px;
      border: 1px solid rgba(212,175,55,0.15);
    }

    /* المشغل الصوتي السفلي الثابت */
    .player-dock {
      position: fixed;
      bottom: 15px;
      left: 15px;
      right: 15px;
      max-width: 700px;
      margin: 0 auto;
      background: rgba(5, 23, 16, 0.95);
      border: 1.5px solid var(--gold-primary);
      border-radius: 20px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 12px 35px rgba(0,0,0,0.7), 0 0 15px rgba(212,175,55,0.2);
      backdrop-filter: blur(12px);
      z-index: 1000;
    }

    .player-info {
      display: flex;
      align-items: center;
      gap: 12px;
      overflow: hidden;
    }

    .playing-avatar {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--gold-gradient);
      color: #04120c;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      flex-shrink: 0;
    }

    .playing-details {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .now-playing-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
    }

    .now-playing-status {
      font-size: 0.78rem;
      color: var(--gold-primary);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      background: #25d366;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 6px #25d366;
    }

    .play-trigger {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--gold-gradient);
      border: none;
      color: #04120c;
      font-size: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(212,175,55,0.4);
      transition: transform 0.2s;
    }

    .play-trigger:active {
      transform: scale(0.92);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- الهيدر والشعار -->
    <header class="header-section">
      <div class="logo-frame">
        <i class="fa-solid fa-kaaba"></i>
      </div>
      <h1 class="app-title">قناة منهاج الهدى</h1>
    </header>

    <!-- بطاقة التعريف المختصرة -->
    <section class="intro-card">
      <div class="quran-ayah">﴿ إِنَّ هَٰذَا الْقُرْآنَ يَهْدِي لِلَّتِي هِيَ أَقْوَمُ ﴾</div>
      <p class="intro-desc">صرح إذاعي جامع لأشهر تلاوات كبار قراء العالم الإسلامي وشروحات السنة المطهرة على مدار 24 ساعة بأعلى درجات النقاء الصوتي.</p>
    </section>

    <!-- شريط البحث السريع -->
    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="searchInput" placeholder="ابحث عن قارئ أو إذاعة..." oninput="filterStations()">
    </div>

    <!-- فئات التصفية -->
    <div class="category-tabs">
      <button class="tab-btn active" onclick="setCategory('all', this)">الكل</button>
      <button class="tab-btn" onclick="setCategory('quran', this)">مشاهير القراء</button>
      <button class="tab-btn" onclick="setCategory('riwayat', this)">الروايات والتجويد</button>
      <button class="tab-btn" onclick="setCategory('adhkar', this)">الأذكار والتفسير</button>
    </div>

    <!-- شبكة المربعات -->
    <div class="radios-grid" id="radiosGrid"></div>
  </div>

  <!-- المشغل الصوتي العائم -->
  <div class="player-dock">
    <div class="player-info">
      <div class="playing-avatar">
        <i class="fa-solid fa-radio"></i>
      </div>
      <div class="playing-details">
        <div class="now-playing-title" id="currentStationTitle">إذاعة الزين محمد أحمد</div>
        <div class="now-playing-status">
          <span class="live-dot"></span>
          <span id="playerStateText">بث حي فائق الجودة</span>
        </div>
      </div>
    </div>
    <button class="play-trigger" id="masterPlayBtn" onclick="togglePlay()">
      <i class="fa-solid fa-play" id="playIcon"></i>
    </button>
  </div>

  <audio id="audioStream" preload="none"></audio>

  <script>
    const stations = [
      { id: 1, name: "الزين محمد أحمد", cat: "quran", url: "https://backup.qurango.net/radio/alzain_mohammad_ahmad", tag: "تلاوة خاشعة" },
      { id: 2, name: "عبد الباسط عبد الصمد", cat: "quran", url: "https://backup.qurango.net/radio/abdulbasit_abdulsamad_mojawwad", tag: "المجود" },
      { id: 3, name: "محمد صديق المنشاوي", cat: "quran", url: "https://backup.qurango.net/radio/mohammed_siddiq_alminshawi_mojawwad", tag: "المجود" },
      { id: 4, name: "محمود خليل الحصري", cat: "quran", url: "https://backup.qurango.net/radio/mahmoud_khalil_alhussary", tag: "المصحف المعلم" },
      { id: 5, name: "مشاري راشد العفاسي", cat: "quran", url: "https://backup.qurango.net/radio/mishary_alafasi", tag: "حفص عن عاصم" },
      { id: 6, name: "سعود الشريم", cat: "quran", url: "https://backup.qurango.net/radio/saoud_alshuraim", tag: "الحرم المكي" },
      { id: 7, name: "عبد الرحمن السديس", cat: "quran", url: "https://backup.qurango.net/radio/abdelrahman_alsudaes", tag: "الحرم المكي" },
      { id: 8, name: "ماهر المعيقلي", cat: "quran", url: "https://backup.qurango.net/radio/maher_al_meaqli", tag: "تلاوة كاملة" },
      { id: 9, name: "ياسر الدوسري", cat: "quran", url: "https://backup.qurango.net/radio/yasser_aldosari", tag: "تلاوة عذبة" },
      { id: 10, name: "أبو بكر الشاطري", cat: "quran", url: "https://backup.qurango.net/radio/abu_bakr_al_shatri", tag: "حفص عن عاصم" },
      { id: 11, name: "سعد الغامدي", cat: "quran", url: "https://backup.qurango.net/radio/saad_alghamdi", tag: "تلاوة مرتلة" },
      { id: 12, name: "محمود علي البنا", cat: "quran", url: "https://backup.qurango.net/radio/mahmoud_ali__albanna_mojawwad", tag: "المجود" },
      { id: 13, name: "ورش عن نافع (تلاوات)", cat: "riwayat", url: "https://backup.qurango.net/radio/warsh", tag: "رواية ورش" },
      { id: 14, name: "قالون عن نافع", cat: "riwayat", url: "https://backup.qurango.net/radio/qalon", tag: "رواية قالون" },
      { id: 15, name: "إذاعة أذكار الصباح والمساء", cat: "adhkar", url: "https://backup.qurango.net/radio/athkar_adhkar", tag: "أذكار وحصن" },
      { id: 16, name: "تفسير القرآن الكريم", cat: "adhkar", url: "https://backup.qurango.net/radio/tafseer", tag: "تفسير وبيان" }
    ];

    let currentCategory = 'all';
    let activeStationIndex = 0;
    const audio = document.getElementById('audioStream');
    const playIcon = document.getElementById('playIcon');
    const stationTitleEl = document.getElementById('currentStationTitle');
    const playerStateEl = document.getElementById('playerStateText');

    function renderGrid() {
      const grid = document.getElementById('radiosGrid');
      const searchVal = document.getElementById('searchInput').value.trim().toLowerCase();
      grid.innerHTML = '';

      stations.forEach((st, idx) => {
        const matchesCat = (currentCategory === 'all' || st.cat === currentCategory);
        const matchesSearch = st.name.toLowerCase().includes(searchVal) || st.tag.toLowerCase().includes(searchVal);

        if (matchesCat && matchesSearch) {
          const card = document.createElement('div');
          card.className = `radio-card ${idx === activeStationIndex ? 'active' : ''}`;
          card.onclick = () => selectStation(idx);
          card.innerHTML = `
            <div class="card-icon">
              <i class="fa-solid ${idx === activeStationIndex && !audio.paused ? 'fa-volume-high' : 'fa-radio'}"></i>
            </div>
            <div class="card-title">${st.name}</div>
            <span class="card-tag">${st.tag}</span>
          `;
          grid.appendChild(card);
        }
      });
    }

    function selectStation(idx) {
      activeStationIndex = idx;
      const st = stations[idx];
      stationTitleEl.textContent = st.name;
      audio.src = st.url;
      playerStateEl.textContent = "جاري الاتصال بالبث...";
      audio.play().then(() => {
        playIcon.className = "fa-solid fa-pause";
        playerStateEl.textContent = "بث حي مباشر";
      }).catch(() => {
        playIcon.className = "fa-solid fa-play";
        playerStateEl.textContent = "اضغط للتشغيل";
      });
      renderGrid();
    }

    function togglePlay() {
      if (!audio.src) {
        selectStation(activeStationIndex);
        return;
      }
      if (audio.paused) {
        audio.play();
        playIcon.className = "fa-solid fa-pause";
        playerStateEl.textContent = "بث حي مباشر";
      } else {
        audio.pause();
        playIcon.className = "fa-solid fa-play";
        playerStateEl.textContent = "متوقف مؤقتاً";
      }
      renderGrid();
    }

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderGrid();
    }

    function filterStations() {
      renderGrid();
    }

    // التهيئة المبدئية
    window.addEventListener('DOMContentLoaded', () => {
      audio.src = stations[0].url;
      renderGrid();
    });
  </script>
</body>
</html>
