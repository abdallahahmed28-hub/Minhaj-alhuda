<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>منهاج الهدى | الصرح الإذاعي القرآني</title>
  
  <!-- إعدادات تطبيق الهاتف والاسم على الشاشة الرئيسية -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="منهاج الهدى">
  <meta name="application-name" content="منهاج الهدى">
  <meta name="theme-color" content="#04140e">

  <!-- أيقونة التطبيق الملكية للهاتف (شعار الكعبة المذهب) -->
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cdefs%3E%3ClinearGradient id='bg' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23051d15'/%3E%3Cstop offset='100%25' stop-color='%23020b08'/%3E%3C/linearGradient%3E%3ClinearGradient id='gold' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23ffe28a'/%3E%3Cstop offset='50%25' stop-color='%23d4af37'/%3E%3Cstop offset='100%25' stop-color='%23997517'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='512' height='512' rx='120' fill='url(%23bg)' stroke='url(%23gold)' stroke-width='14'/%3E%3Cpath d='M256 120 L380 180 L256 240 L132 180 Z' fill='url(%23gold)' opacity='0.9'/%3E%3Cpath d='M132 195 L250 252 V370 L132 305 Z' fill='%23111' stroke='url(%23gold)' stroke-width='4'/%3E%3Cpath d='M380 195 L262 252 V370 L380 305 Z' fill='%231f1f1f' stroke='url(%23gold)' stroke-width='4'/%3E%3Ccircle cx='256' cy='256' r='200' fill='none' stroke='url(%23gold)' stroke-width='2' stroke-dasharray='10 15' opacity='0.4'/%3E%3C/svg%3E">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cdefs%3E%3ClinearGradient id='bg' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23051d15'/%3E%3Cstop offset='100%25' stop-color='%23020b08'/%3E%3C/linearGradient%3E%3ClinearGradient id='gold' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23ffe28a'/%3E%3Cstop offset='50%25' stop-color='%23d4af37'/%3E%3Cstop offset='100%25' stop-color='%23997517'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='512' height='512' rx='120' fill='url(%23bg)' stroke='url(%23gold)' stroke-width='14'/%3E%3Cpath d='M256 120 L380 180 L256 240 L132 180 Z' fill='url(%23gold)' opacity='0.9'/%3E%3Cpath d='M132 195 L250 252 V370 L132 305 Z' fill='%23111' stroke='url(%23gold)' stroke-width='4'/%3E%3Cpath d='M380 195 L262 252 V370 L380 305 Z' fill='%231f1f1f' stroke='url(%23gold)' stroke-width='4'/%3E%3C/svg%3E">

  <!-- الخطوط والأيقونات الفاخرة -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-dark: #03100a;
      --card-bg: rgba(6, 30, 21, 0.85);
      --card-active: rgba(12, 54, 38, 0.95);
      --gold-primary: #d4af37;
      --gold-light: #fef0be;
      --gold-gradient: linear-gradient(135deg, #fff2be 0%, #d4af37 50%, #997517 100%);
      --border-gold: rgba(212, 175, 55, 0.35);
      --text-muted: #b8cfc5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      background-image: radial-gradient(circle at top center, #0a3323 0%, #03100a 75%);
      color: #fff;
      font-family: 'Cairo', sans-serif;
      min-height: 100vh;
      padding-bottom: 130px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 16px 14px;
    }

    .header-section {
      text-align: center;
      padding: 10px 0 6px;
    }

    .logo-frame {
      width: 72px;
      height: 72px;
      margin: 0 auto 10px;
      background: linear-gradient(145deg, #093424, #03140d);
      border: 2px solid var(--gold-primary);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 22px rgba(0,0,0,0.6), inset 0 0 12px rgba(212,175,55,0.25);
    }

    .logo-frame i {
      font-size: 36px;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .app-title {
      font-family: 'Amiri', serif;
      font-size: 2.1rem;
      font-weight: 700;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .intro-card {
      background: var(--card-bg);
      border: 1px solid var(--border-gold);
      border-radius: 14px;
      padding: 14px 18px;
      margin-bottom: 18px;
      backdrop-filter: blur(10px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.35);
    }

    .quran-ayah {
      font-family: 'Amiri Quran', serif;
      font-size: 1.2rem;
      color: var(--gold-light);
      text-align: center;
      line-height: 1.8;
      margin-bottom: 6px;
    }

    .intro-desc {
      font-size: 0.88rem;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.5;
    }

    .stats-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(212, 175, 55, 0.12);
      border: 1px solid var(--border-gold);
      padding: 4px 14px;
      border-radius: 20px;
      color: var(--gold-light);
      font-size: 0.82rem;
      margin-top: 8px;
    }

    /* شريط البحث */
    .search-box {
      position: relative;
      margin-bottom: 16px;
    }

    .search-box input {
      width: 100%;
      padding: 13px 44px 13px 18px;
      background: rgba(8, 38, 27, 0.9);
      border: 1.2px solid var(--border-gold);
      border-radius: 14px;
      color: #fff;
      font-family: 'Cairo', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s ease;
    }

    .search-box input:focus {
      border-color: var(--gold-primary);
      box-shadow: 0 0 14px rgba(212,175,55,0.35);
    }

    .search-box i {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gold-primary);
      font-size: 1.1rem;
    }

    /* شبكة المربعات الملكية للقراء (170+ إذاعة) */
    .radios-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
    }

    @media (min-width: 600px) {
      .radios-grid {
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 16px;
      }
    }

    .radio-card {
      background: var(--card-bg);
      border: 1px solid var(--border-gold);
      border-radius: 16px;
      padding: 16px 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.22s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 125px;
    }

    .radio-card:active, .radio-card:hover {
      transform: translateY(-2px);
      border-color: var(--gold-primary);
      box-shadow: 0 6px 18px rgba(0,0,0,0.4);
    }

    .radio-card.active {
      background: var(--card-active);
      border-color: var(--gold-primary);
      box-shadow: 0 0 16px rgba(212,175,55,0.4);
    }

    .card-icon {
      width: 42px;
      height: 42px;
      background: rgba(4, 18, 12, 0.85);
      border: 1px solid var(--border-gold);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
      color: var(--gold-primary);
      font-size: 1.1rem;
      transition: 0.25s;
    }

    .radio-card.active .card-icon {
      background: var(--gold-gradient);
      color: #03100a;
      transform: scale(1.08);
    }

    .card-title {
      font-size: 0.92rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.35;
      margin-bottom: 4px;
    }

    .card-tag {
      font-size: 0.72rem;
      color: var(--gold-light);
      background: rgba(212, 175, 55, 0.12);
      padding: 2px 8px;
      border-radius: 10px;
      border: 1px solid rgba(212,175,55,0.18);
    }

    /* المشغل الصوتي السفلي */
    .player-dock {
      position: fixed;
      bottom: 15px;
      left: 14px;
      right: 14px;
      max-width: 700px;
      margin: 0 auto;
      background: rgba(5, 22, 15, 0.96);
      border: 1.5px solid var(--gold-primary);
      border-radius: 20px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 12px 35px rgba(0,0,0,0.7), 0 0 15px rgba(212,175,55,0.2);
      backdrop-filter: blur(14px);
      z-index: 1000;
    }

    .player-info {
      display: flex;
      align-items: center;
      gap: 12px;
      overflow: hidden;
    }

    .playing-avatar {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--gold-gradient);
      color: #04120c;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      flex-shrink: 0;
    }

    .playing-details {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .now-playing-title {
      font-size: 0.92rem;
      font-weight: 700;
      color: #fff;
    }

    .now-playing-status {
      font-size: 0.76rem;
      color: var(--gold-primary);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      background: #25d366;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 6px #25d366;
    }

    .play-trigger {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--gold-gradient);
      border: none;
      color: #04120c;
      font-size: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(212,175,55,0.4);
      flex-shrink: 0;
    }

    .loading-spinner {
      text-align: center;
      padding: 40px 0;
      color: var(--gold-primary);
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header class="header-section">
      <div class="logo-frame">
        <i class="fa-solid fa-kaaba"></i>
      </div>
      <h1 class="app-title">قناة منهاج الهدى</h1>
    </header>

    <section class="intro-card">
      <div class="quran-ayah">﴿ إِنَّ هَٰذَا الْقُرْآنَ يَهْدِي لِلَّتِي هِيَ أَقْوَمُ ﴾</div>
      <p class="intro-desc">صرح إذاعي جامع لروائع التلاوات بأصوات كبار قراء العالم الإسلامي وشروحات السنة المطهرة على مدار 24 ساعة.</p>
      <div style="text-align:center;">
        <span class="stats-badge" id="stationsCountBadge">
          <i class="fa-solid fa-tower-broadcast"></i> جاري تحميل الإذاعات...
        </span>
      </div>
    </section>

    <!-- حقل البحث -->
    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="searchInput" placeholder="ابحث في أكثر من 170 إذاعة وقارئ..." oninput="filterStations()">
    </div>

    <!-- شبكة المربعات -->
    <div class="radios-grid" id="radiosGrid">
      <div class="loading-spinner">
        <i class="fa-solid fa-spinner fa-spin"></i> جاري إعداد صرح القراء والإذاعات...
      </div>
    </div>
  </div>

  <!-- المشغل الصوتي -->
  <div class="player-dock">
    <div class="player-info">
      <div class="playing-avatar">
        <i class="fa-solid fa-radio"></i>
      </div>
      <div class="playing-details">
        <div class="now-playing-title" id="currentStationTitle">إذاعة الزين محمد أحمد</div>
        <div class="now-playing-status">
          <span class="live-dot"></span>
          <span id="playerStateText">بث حي مباشر</span>
        </div>
      </div>
    </div>
    <button class="play-trigger" id="masterPlayBtn" onclick="togglePlay()">
      <i class="fa-solid fa-play" id="playIcon"></i>
    </button>
  </div>

  <audio id="audioStream" preload="none"></audio>

  <script>
    let allRadios = [];
    let activeStationIndex = 0;
    const audio = document.getElementById('audioStream');
    const playIcon = document.getElementById('playIcon');
    const stationTitleEl = document.getElementById('currentStationTitle');
    const playerStateEl = document.getElementById('playerStateText');
    const countBadgeEl = document.getElementById('stationsCountBadge');

    // جلب قائمة الإذاعات الكاملة (170+ إذاعة وقارئ)
    async function loadRadios() {
      try {
        const res = await fetch('https://mp3quran.net/api/v3/radios?language=ar');
        const data = await res.json();
        if (data && data.radios && data.radios.length > 0) {
          allRadios = data.radios.map((r, i) => {
            let cleanName = r.name.replace(/^إذاعة\s+/i, '').replace(/^-+/g, '').replace(/-+$/g, '').trim();
            return {
              id: r.id || i,
              name: cleanName,
              fullName: r.name,
              url: r.url,
              tag: cleanName.includes('ورش') ? 'ورش عن نافع' : cleanName.includes('قالون') ? 'قالون' : cleanName.includes('تفسير') ? 'تفسير' : cleanName.includes('أذكار') ? 'أذكار' : 'بث مباشر'
            };
          });
        }
      } catch (e) {
        console.error("API error, fallback to default", e);
      }

      if (!allRadios || allRadios.length === 0) {
        allRadios = [
          { id: 1, name: "الزين محمد أحمد", fullName: "إذاعة الزين محمد أحمد", url: "https://backup.qurango.net/radio/alzain_mohammad_ahmad", tag: "حفص عن عاصم" },
          { id: 2, name: "عبد الباسط عبد الصمد", fullName: "إذاعة عبد الباسط عبد الصمد (المجود)", url: "https://backup.qurango.net/radio/abdulbasit_abdulsamad_mojawwad", tag: "المجود" },
          { id: 3, name: "محمد صديق المنشاوي", fullName: "إذاعة المنشاوي (المجود)", url: "https://backup.qurango.net/radio/mohammed_siddiq_alminshawi_mojawwad", tag: "المجود" }
        ];
      }

      countBadgeEl.innerHTML = `<i class="fa-solid fa-tower-broadcast"></i> ${allRadios.length} قارئ وإذاعة حية`;
      audio.src = allRadios[0].url;
      stationTitleEl.textContent = allRadios[0].name;
      renderGrid();
    }

    function renderGrid() {
      const grid = document.getElementById('radiosGrid');
      const searchVal = document.getElementById('searchInput').value.trim().toLowerCase();
      grid.innerHTML = '';

      const filtered = allRadios.filter(st => st.fullName.toLowerCase().includes(searchVal) || st.name.toLowerCase().includes(searchVal));

      if (filtered.length === 0) {
        grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:30px;color:var(--text-muted);">لا توجد نتائج مطابقة لبحثك</div>';
        return;
      }

      filtered.forEach((st) => {
        const originalIndex = allRadios.findIndex(r => r.url === st.url);
        const card = document.createElement('div');
        card.className = `radio-card ${originalIndex === activeStationIndex ? 'active' : ''}`;
        card.onclick = () => selectStation(originalIndex);
        card.innerHTML = `
          <div class="card-icon">
            <i class="fa-solid ${originalIndex === activeStationIndex && !audio.paused ? 'fa-volume-high' : 'fa-radio'}"></i>
          </div>
          <div class="card-title">${st.name}</div>
          <span class="card-tag">${st.tag}</span>
        `;
        grid.appendChild(card);
      });
    }

    function selectStation(idx) {
      activeStationIndex = idx;
      const st = allRadios[idx];
      stationTitleEl.textContent = st.name;
      audio.src = st.url;
      playerStateEl.textContent = "جاري الاتصال بالبث...";
      audio.play().then(() => {
        playIcon.className = "fa-solid fa-pause";
        playerStateEl.textContent = "بث حي مباشر";
      }).catch(() => {
        playIcon.className = "fa-solid fa-play";
        playerStateEl.textContent = "اضغط للتشغيل";
      });
      renderGrid();
    }

    function togglePlay() {
      if (!audio.src && allRadios.length > 0) {
        selectStation(activeStationIndex);
        return;
      }
      if (audio.paused) {
        audio.play();
        playIcon.className = "fa-solid fa-pause";
        playerStateEl.textContent = "بث حي مباشر";
      } else {
        audio.pause();
        playIcon.className = "fa-solid fa-play";
        playerStateEl.textContent = "متوقف مؤقتاً";
      }
      renderGrid();
    }

    function filterStations() {
      renderGrid();
    }

    window.addEventListener('DOMContentLoaded', loadRadios);
  </script>
</body>
</html>
